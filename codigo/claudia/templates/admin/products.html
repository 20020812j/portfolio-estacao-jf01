{% extends "base.html" %}
{% block content %}
<section class="admin-page">
  <div class="admin-top"><div><span class="eyebrow">Painel administrativo</span><h1>Produtos</h1></div><a class="btn outline" href="{{ url_for('admin_dashboard') }}">Pedidos</a></div>
  <div class="admin-columns">
    <form method="post" class="form-card">
      <h2>Novo produto</h2>
      <label>Nome<input name="name" required></label>
      <label>Descrição<textarea name="description" required></textarea></label>
      <label>Preço<input name="price" inputmode="decimal" placeholder="25,00" required></label>
      <label>Categoria<select name="category"><option>Pratos do dia</option><option>Sopas e caldos</option><option>Bebidas</option><option>Sobremesas</option></select></label>
      <label>URL da imagem<input name="image"></label>
      <label class="inline"><input type="checkbox" name="featured"> Destacar na página inicial</label>
      <button class="btn primary full">Cadastrar</button>
    </form>
    <div class="table-wrap">
      <table><thead><tr><th>Produto</th><th>Preço</th><th>Status</th><th></th></tr></thead><tbody>
      {% for p in products %}
      <tr><td>{{ p.name }}<br><small>{{ p.category }}</small></td><td>{{ p.price|brl }}</td><td>{{ 'Ativo' if p.active else 'Inativo' }}</td><td><form method="post" action="{{ url_for('toggle_product', product_id=p.id) }}"><button class="btn small outline">{{ 'Desativar' if p.active else 'Ativar' }}</button></form></td></tr>
      {% endfor %}
      </tbody></table>
    </div>
  </div>
</section>
{% endblock %}
