{% extends "base.html" %}
{% block content %}
<h1>Reavaliação — {{ paciente.nome }}</h1>
<form class="card form-grid" method="post">
<label>Data<input type="date" name="data_reavaliacao"></label>
<label>Peso (kg)<input type="number" step="0.01" name="peso"></label>
<label>Altura (m)<input type="number" step="0.01" name="altura"></label>
<label>EVA<input type="number" min="0" max="10" name="eva"></label>
<label class="full">Goniometria<textarea name="goniometria"></textarea></label>
<label class="full">Força muscular<textarea name="forca_muscular"></textarea></label>
<label class="full">Observações<textarea name="observacoes"></textarea></label>
<div class="full"><button class="btn primary">Salvar reavaliação</button></div>
</form>
{% endblock %}
